<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KR Stock Naver Charts</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        .chart-container {
            display: grid;
            grid-template-columns: 1fr;
            /* Default to single column on small screens */
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {

            /* Two columns on screens wider than 768px */
            .chart-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .chart-item img {
            max-width: 100%;
            height: auto;
            display: block;
            /* Remove extra space below image */
            border: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Music Toggle Button Style */
        #music-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #ddd;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, background 0.3s ease;
            z-index: 1000;
        }

        #music-toggle:hover {
            transform: scale(1.1);
            background: #fff;
        }

        #music-toggle.playing {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 123, 255, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(0, 123, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 123, 255, 0);
            }
        }

        /* World Clock Widget Style */
        .world-clock-container {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            margin: 20px auto;
        }

        .global-date {
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            letter-spacing: 1px;
        }

        .clocks-wrapper {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .clock-item {
            text-align: center;
            min-width: 160px;
        }

        .clock-label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .clock-time {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a1a;
            font-family: 'Monaco', 'Consolas', monospace;
            background: linear-gradient(135deg, #2c3e50, #000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .market-hours {
            font-size: 0.75rem;
            color: #888;
            font-weight: 500;
        }

        .market-label {
            display: block;
            font-size: 0.65rem;
            color: #aaa;
            margin-bottom: 2px;
        }

        @media (max-width: 768px) {
            .clocks-wrapper {
                flex-direction: column;
                gap: 25px;
                align-items: center;
            }

            .world-clock-container {
                margin: 10px;
                padding: 20px;
            }

            .clock-item {
                min-width: auto;
            }
        }
    </style>
</head>

<body>
    <div class="world-clock-container">
        <div id="global-date" class="global-date">----.--.-- (---)</div>
        <div class="clocks-wrapper">
            <div class="clock-item">
                <div class="clock-label">🇰🇷 Seoul</div>
                <div id="seoul-time" class="clock-time">--:--</div>
                <div class="market-hours">
                    <span class="market-label">KRX Trading Hours</span>
                    09:00 - 15:30
                </div>
            </div>
            <div class="clock-item">
                <div class="clock-label">🇬🇧 London</div>
                <div id="london-time" class="clock-time">--:--</div>
                <div class="market-hours">
                    <span class="market-label">LSE Trading Hours</span>
                    08:00 - 16:30
                </div>
            </div>
            <div class="clock-item">
                <div class="clock-label">🇺🇸 New York</div>
                <div id="newyork-time" class="clock-time">--:--</div>
                <div class="market-hours">
                    <span class="market-label">NYSE Trading Hours</span>
                    09:30 - 16:00
                </div>
            </div>
        </div>
    </div>
    <h2>국내주식 가격 차트 (최근3달)</h2>
    <p>출처: 네이버금융</p>
    <div class="chart-container">
        <div class="chart-item">
            <h2>삼성전자 (005930)</h2>
            <img src="https://ssl.pstatic.net/imgfinance/chart/item/area/month3/005930.png?sidcode=1775014816911"
                alt="삼성전자 3개월 차트"
                onerror="this.src='https://ssl.pstatic.net/imgstock/chart3/world2008/error_700x289.png'">
        </div>
        <div class="chart-item">
            <h2>SK하이닉스 (000660)</h2>
            <img src="https://ssl.pstatic.net/imgfinance/chart/item/area/month3/000660.png?sidcode=1775015125328"
                alt="SK하이닉스 3개월 차트"
                onerror="this.src='https://ssl.pstatic.net/imgstock/chart3/world2008/error_700x289.png'">
        </div>
    </div>

    <audio id="bgm" src="bgm.mp3" loop></audio>
    <button id="music-toggle" title="Toggle Music">🎵</button>

    <script>
        const bgm = document.getElementById('bgm');
        const toggle = document.getElementById('music-toggle');
        let isPlaying = false;

        toggle.addEventListener('click', () => {
            if (isPlaying) {
                bgm.pause();
                toggle.textContent = '🔇';
                toggle.classList.remove('playing');
            } else {
                bgm.play().catch(e => console.log("Playback failed:", e));
                toggle.textContent = '🎵';
                toggle.classList.add('playing');
            }
            isPlaying = !isPlaying;
        });

        // Try to autoplay (might be blocked by browser)
        window.addEventListener('load', () => {
            bgm.play().then(() => {
                isPlaying = true;
                toggle.classList.add('playing');
            }).catch(() => {
                console.log("Autoplay blocked. Waiting for user interaction.");
            });
        });

        // World Clock Update Logic
        function updateClocks() {
            const now = new Date();
            const zones = [
                { id: 'seoul', zone: 'Asia/Seoul' },
                { id: 'london', zone: 'Europe/London' },
                { id: 'newyork', zone: 'America/New_York' }
            ];

            // Update Global Date (using Seoul as reference)
            const globalDateFormatter = new Intl.DateTimeFormat('en-GB', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                weekday: 'short',
                timeZone: 'Asia/Seoul'
            }).formatToParts(now);

            const gd = globalDateFormatter.find(p => p.type === 'day').value;
            const gm = globalDateFormatter.find(p => p.type === 'month').value;
            const gy = globalDateFormatter.find(p => p.type === 'year').value;
            const gwd = globalDateFormatter.find(p => p.type === 'weekday').value;
            document.getElementById('global-date').textContent = `${gy}.${gm}.${gd} (${gwd})`;

            zones.forEach(z => {
                const timeStr = new Intl.DateTimeFormat('en-GB', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false,
                    timeZone: z.zone
                }).format(now);

                document.getElementById(`${z.id}-time`).textContent = timeStr;
            });
        }

        setInterval(updateClocks, 1000);
        updateClocks();
    </script>
</body>

</html>
