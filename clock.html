<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clocks for Investors</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        /* === CLOCK WIDGET START: CSS === */
        /* World Clock Widget Style */
        .world-clock-container {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            margin: 20px auto;
        }

        .global-date {
            font-size: 1.1rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            letter-spacing: 1px;
        }

        .clocks-wrapper {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .clock-item {
            text-align: center;
            min-width: 160px;
        }

        .clock-label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .clock-time {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a1a;
            font-family: 'Monaco', 'Consolas', monospace;
            background: linear-gradient(135deg, #2c3e50, #000);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .market-hours {
            font-size: 0.75rem;
            color: #888;
            font-weight: 500;
        }

        .market-label {
            display: block;
            font-size: 0.65rem;
            color: #aaa;
            margin-bottom: 2px;
        }

        @media (max-width: 768px) {
            .clocks-wrapper {
                flex-direction: column;
                gap: 25px;
                align-items: center;
            }

            .world-clock-container {
                margin: 10px;
                padding: 20px;
            }

            .clock-item {
                min-width: auto;
            }
        }
        /* === CLOCK WIDGET END: CSS === */
    </style>
</head>

<body>
    <!-- === CLOCK WIDGET START: HTML === -->
    <div class="world-clock-container">
        <div id="global-date" class="global-date">----.--.-- (---)</div>
        <div class="clocks-wrapper">
            <div class="clock-item">
                <div class="clock-label">🇰🇷 Seoul</div>
                <div id="seoul-time" class="clock-time">--:--</div>
                <div class="market-hours">
                    <span class="market-label">KRX Trading Hours</span>
                    09:00 - 15:30
                </div>
            </div>
            <div class="clock-item">
                <div class="clock-label">🇬🇧 London</div>
                <div id="london-time" class="clock-time">--:--</div>
                <div class="market-hours">
                    <span class="market-label">LSE Trading Hours</span>
                    08:00 - 16:30
                </div>
            </div>
            <div class="clock-item">
                <div class="clock-label">🇺🇸 New York</div>
                <div id="newyork-time" class="clock-time">--:--</div>
                <div class="market-hours">
                    <span class="market-label">NYSE Trading Hours</span>
                    09:30 - 16:00
                </div>
            </div>
        </div>
    </div>
    <!-- === CLOCK WIDGET END: HTML === -->

    <script>
        /* === CLOCK WIDGET START: JS === */
        // World Clock Update Logic
        function updateClocks() {
            const now = new Date();
            const zones = [
                { id: 'seoul', zone: 'Asia/Seoul' },
                { id: 'london', zone: 'Europe/London' },
                { id: 'newyork', zone: 'America/New_York' }
            ];

            // Update Global Date (using Seoul as reference)
            const dateParts = new Intl.DateTimeFormat('en-GB', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                weekday: 'short',
                timeZone: 'Asia/Seoul'
            }).formatToParts(now).reduce((acc, part) => ({ ...acc, [part.type]: part.value }), {});

            document.getElementById('global-date').textContent = 
                `${dateParts.year}.${dateParts.month}.${dateParts.day} (${dateParts.weekday})`;

            zones.forEach(z => {
                const timeStr = new Intl.DateTimeFormat('en-GB', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false,
                    timeZone: z.zone
                }).format(now);

                document.getElementById(`${z.id}-time`).textContent = timeStr;
            });
        }

        setInterval(updateClocks, 1000);
        updateClocks();
        /* === CLOCK WIDGET END: JS === */
    </script>
</body>

</html>
